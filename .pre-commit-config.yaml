repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: markdown-link-check
        name: Markdown link check
        entry: pwsh -NoProfile -File scripts/check-markdown-links.ps1
        language: system
        pass_filenames: false
        types: [markdown]

      - id: react-doctor
        name: React Doctor
        entry: node scripts/run-react-doctor.js
        language: system
        pass_filenames: true
        require_serial: true
        files: ^(src|app|components|lib|hooks)/.*\.(ts|tsx|js|jsx|mjs|cjs)$

      - id: component-sourcing-preflight
        name: Component sourcing preflight
        entry: node scripts/verify-component-sourcing-preflight.mjs
        language: system
        pass_filenames: false
        files: ^(src/components/.*\.(tsx|jsx)|docs/preflight/(component-baseline\.json|records/.*\.md)|scripts/verify-component-sourcing-preflight\.mjs)$

      - id: captured-surfaces-canonical
        name: Captured-surface manifest (canonical Gap-2 gate)
        entry: node scripts/captured-surfaces/derive-captured-surfaces.mjs --repo .
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(src/app/.*|docs/captured-surfaces(\.config)?\.json|scripts/captured-surfaces/.*)$

      - id: captured-surfaces-canonical-selftest
        name: Captured-surface gate negative proof (31 fixtures, each asserting its own code)
        entry: node scripts/captured-surfaces/derive-captured-surfaces.mjs --self-test
        language: system
        pass_filenames: false
        require_serial: true
        files: ^scripts/captured-surfaces/.*$
