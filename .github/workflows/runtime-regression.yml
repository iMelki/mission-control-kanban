name: Runtime Regression

permissions:
  contents: read
  actions: read

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue number to receive runtime artifact links'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * *'

jobs:
  turbopack-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run non-blocking Turbopack build inventory
        shell: bash
        run: |
          set +e
          npm run build:turbo 2>&1 | tee turbopack-build.log
          status=${PIPESTATUS[0]}
          echo "TURBOPACK_STATUS=$status" | tee turbopack-summary.env
          grep -Ei "NFT|tracing|unexpected file|Dynamic filesystem" turbopack-build.log > turbopack-warnings.txt || true
          exit 0
      - name: Upload Turbopack inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mck-turbopack-inventory
          path: |
            turbopack-build.log
            turbopack-warnings.txt
            turbopack-summary.env
          if-no-files-found: warn
          retention-days: 14

  runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            npx playwright install chromium && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Run runtime regression checks
        env:
          MCK_SMOKE_ARTIFACT_DIR: artifacts/runtime-ui-smoke/ci
        run: npm run check:runtime-regressions
      - name: Upload runtime smoke artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mck-runtime-ui-smoke
          path: |
            artifacts/runtime-ui-smoke/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Write runtime artifact links to step summary
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run comment:runtime-artifacts -- --dry-run --github-step-summary --branch "${{ github.ref_name }}" --run-id "${{ github.run_id }}"

  comment-runtime-artifacts-pr:
    name: Comment runtime artifact links on PR
    needs: runtime-regression
    if: >-
      ${{
        needs.runtime-regression.result == 'success' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REF_NAME: ${{ github.event.pull_request.head.ref }}
      COMMENT_TARGET: ${{ github.event.pull_request.number }}
    steps:
      - name: Post and verify runtime artifact comment
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GH_REPO}/actions/runs/${RUN_ID}"
          artifacts_json="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts")"

          {
            printf '%s\n' '<!-- mck-runtime-regression-artifact-evidence -->'
            printf '%s\n\n' 'Runtime regression artifact evidence:'
            printf '%s\n' "- Workflow: Runtime Regression"
            printf '%s\n' "- Run: ${run_url}"
            printf '%s\n' '- Status: completed; conclusion: success'
            printf '%s\n' "- Commit: ${HEAD_SHA}"
            printf '%s\n' "- Branch: ${REF_NAME}"
            printf '%s\n' '- Artifacts:'
            artifact_lines="$(
              jq -r --arg run_url "$run_url" \
                '.artifacts[] | select(.expired == false) | "- [\(.name)](\($run_url)/artifacts/\(.id)); expires \(.expires_at)"' \
                <<< "$artifacts_json"
            )"
            if [ -n "$artifact_lines" ]; then
              printf '%s\n' "$artifact_lines"
            else
              printf '%s\n' '- No unexpired artifacts found for this run.'
            fi
          } > comment.md

          jq -n --rawfile body comment.md '{body: $body}' > comment-request.json
          comment_id="$(gh api --paginate --slurp \
            "repos/${GH_REPO}/issues/${COMMENT_TARGET}/comments" \
            --jq '[.[][] | select(.body | contains("<!-- mck-runtime-regression-artifact-evidence -->")) | .id][0] // empty')"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GH_REPO}/issues/comments/${comment_id}" \
              --input comment-request.json > /dev/null
          else
            comment_id="$(
              gh api --method POST \
                "repos/${GH_REPO}/issues/${COMMENT_TARGET}/comments" \
                --input comment-request.json \
                --jq '.id'
            )"
          fi
          gh api "repos/${GH_REPO}/issues/comments/${comment_id}" \
            > comment-readback.json
          jq -e --rawfile expected comment.md '.body == $expected' comment-readback.json

  comment-runtime-artifacts-issue:
    name: Comment runtime artifact links on requested issue
    needs: runtime-regression
    if: >-
      ${{
        needs.runtime-regression.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.issue_number != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      HEAD_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      COMMENT_TARGET: ${{ inputs.issue_number }}
    steps:
      - name: Post and verify runtime artifact comment
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GH_REPO}/actions/runs/${RUN_ID}"
          artifacts_json="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts")"

          {
            printf '%s\n' '<!-- mck-runtime-regression-artifact-evidence -->'
            printf '%s\n\n' 'Runtime regression artifact evidence:'
            printf '%s\n' "- Workflow: Runtime Regression"
            printf '%s\n' "- Run: ${run_url}"
            printf '%s\n' '- Status: completed; conclusion: success'
            printf '%s\n' "- Commit: ${HEAD_SHA}"
            printf '%s\n' "- Branch: ${REF_NAME}"
            printf '%s\n' '- Artifacts:'
            artifact_lines="$(
              jq -r --arg run_url "$run_url" \
                '.artifacts[] | select(.expired == false) | "- [\(.name)](\($run_url)/artifacts/\(.id)); expires \(.expires_at)"' \
                <<< "$artifacts_json"
            )"
            if [ -n "$artifact_lines" ]; then
              printf '%s\n' "$artifact_lines"
            else
              printf '%s\n' '- No unexpired artifacts found for this run.'
            fi
          } > comment.md

          jq -n --rawfile body comment.md '{body: $body}' > comment-request.json
          comment_id="$(gh api --paginate --slurp \
            "repos/${GH_REPO}/issues/${COMMENT_TARGET}/comments" \
            --jq '[.[][] | select(.body | contains("<!-- mck-runtime-regression-artifact-evidence -->")) | .id][0] // empty')"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/${GH_REPO}/issues/comments/${comment_id}" \
              --input comment-request.json > /dev/null
          else
            comment_id="$(
              gh api --method POST \
                "repos/${GH_REPO}/issues/${COMMENT_TARGET}/comments" \
                --input comment-request.json \
                --jq '.id'
            )"
          fi
          gh api "repos/${GH_REPO}/issues/comments/${comment_id}" \
            > comment-readback.json
          jq -e --rawfile expected comment.md '.body == $expected' comment-readback.json
