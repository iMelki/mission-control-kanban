name: Runtime Regression

permissions:
  contents: read
  actions: read
  issues: write

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue number to receive runtime artifact links'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * *'

jobs:
  turbopack-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run non-blocking Turbopack build inventory
        shell: bash
        run: |
          set +e
          npm run build:turbo 2>&1 | tee turbopack-build.log
          status=${PIPESTATUS[0]}
          echo "TURBOPACK_STATUS=$status" | tee turbopack-summary.env
          grep -Ei "NFT|tracing|unexpected file|Dynamic filesystem" turbopack-build.log > turbopack-warnings.txt || true
          exit 0
      - name: Upload Turbopack inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mck-turbopack-inventory
          path: |
            turbopack-build.log
            turbopack-warnings.txt
            turbopack-summary.env
          if-no-files-found: warn
          retention-days: 14

  runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            npx playwright install chromium && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Run runtime regression checks
        env:
          MCK_SMOKE_ARTIFACT_DIR: artifacts/runtime-ui-smoke/ci
        run: npm run check:runtime-regressions
      - name: Upload runtime smoke artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mck-runtime-ui-smoke
          path: |
            artifacts/runtime-ui-smoke/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Write runtime artifact links to step summary
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run comment:runtime-artifacts -- --dry-run --github-step-summary --branch "${{ github.ref_name }}" --run-id "${{ github.run_id }}"
      - name: Comment artifact links on PR/requested issue after successful CI
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.issue_number != '') || github.event_name == 'pull_request') }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_TARGET: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.issue_number }}
        run: npm run comment:runtime-artifacts -- --issue "$COMMENT_TARGET" --branch "${{ github.ref_name }}" --run-id "${{ github.run_id }}"
