name: Runtime Regression

permissions:
  contents: read
  actions: read
  issues: write

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue number to receive runtime artifact links'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * *'

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run runtime regression checks
        env:
          MCK_SMOKE_ARTIFACT_DIR: artifacts/runtime-ui-smoke/ci
        run: npm run check:runtime-regressions
      - name: Upload runtime smoke artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mck-runtime-ui-smoke
          path: |
            artifacts/runtime-ui-smoke/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Comment artifact links on requested issue
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run comment:runtime-artifacts -- --issue "${{ inputs.issue_number }}" --branch "${{ github.ref_name }}"
